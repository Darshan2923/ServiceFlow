
services:
  postgres:
    image: postgres:17-alpine
    container_name: serviceflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: serviceflow
      POSTGRES_USER: serviceflow_app
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - serviceflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceflow_app -d serviceflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  serviceflow_postgres_data:
